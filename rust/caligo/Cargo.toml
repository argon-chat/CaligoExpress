[package]
name = "caligo"
version = "0.1.0"
description = "CaligoExpress client engine: signed manifests, chunked updates, crash-safe install, bootstrapper self-update"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
flate2 = "1"
log = "0.4"
# The blocking client: its `timeout` bounds the wait for response headers and
# every body read on its own, which is the engine's response and stall timeout.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
# Ed25519 verification and SHA-256; already in any rustls graph.
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"
